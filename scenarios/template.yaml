# Каркас YAML-файла для нового триггерного сценария MindBox.
# Скопируй в scenarios/src/<id>.yaml и заполни поля.
# Полная документация полей: scenarios/schema.md

id: example                          # обязательно, уникален среди всех файлов в src/
title: ""                            # человекочитаемое название из MindBox UI
folder: "/"                          # папка в дереве сценариев MindBox
status: draft                        # enabled | draft | stopped
notes: >
  Свободный текст: контекст, история, ссылка на задачу.

# trigger:                           # обязателен. Пример для event:
#   type: event                      # event | schedule
#   event: customer_registered       # ID события из доки MindBox (для type=event)
#   pre_filters:                     # опц., объект {summary, detail?}
#     summary: |
#       Email заполнен и валидный
#       Подписан на канал X
#     # detail: []                   # опц. структурный список (форма свободная)
#   frequency_per_customer: once     # once | every | per_period
#   # per_period: { every: 7d }      # обязателен ТОЛЬКО при frequency_per_customer=per_period
#   frequency_per_order: null        # опц., те же значения или null
#
# # Пример для type=schedule:
# trigger:
#   type: schedule
#   schedule:
#     mode: daily                    # daily | weekly | monthly
#     time: "14:10"                  # HH:MM
#     timezone: "Europe/Moscow"      # IANA-id
#     # weekdays: [mon, wed, fri]    # required для mode=weekly
#     # days: [1, 15]                # для mode=monthly: список чисел ИЛИ
#     # day_of_month: last           #                    одна метка
#   pre_filters:
#     summary: |
#       Условия отбора клиентов на запуске

